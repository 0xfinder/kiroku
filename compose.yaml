# Postgres for kiroku (D9, D18). The pgvector image from day one, so Phase 5 is just
# `CREATE EXTENSION vector`. CI starts this same file, so the image is defined once.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiroku
      POSTGRES_PASSWORD: kiroku # loopback-only, never exposed (D18)
      POSTGRES_DB: kiroku
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sized for a 2 vCPU / 3 GB host shared with the app and ffmpeg.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=8MB", "-c", "max_connections=30"]
    healthcheck:
      # Over TCP: during first-boot init the temporary server listens only on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kiroku -d kiroku"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
